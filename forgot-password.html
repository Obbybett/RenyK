<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenyK - Forgot Password</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Alpine.js for interactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50">

    <div class="flex min-h-screen flex-col items-center justify-center bg-cover bg-center px-6 py-12 lg:px-8" style="background-image: url('https://images.unsplash.com/photo-1560518883-ce09059ee41F?q=80&w=2874&auto=format&fit=crop');">
        <div class="sm:mx-auto sm:w-full sm:max-w-md" x-data="{ submitted: false }">
            <div class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-2xl p-8 sm:p-12">
                <a href="index.html" class="text-2xl font-bold text-teal-600 block text-center mb-6">RenyK</a>
                
                <template x-if="!submitted">
                    <div>
                        <h2 class="text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">Forgot Password?</h2>
                        <p class="mt-2 text-center text-sm text-gray-600">
                            No problem. Enter your email below and we'll send you a password reset link.
                        </p>

                        <form class="mt-8 space-y-6" @submit.prevent="submitted = true">
                            <div>
                                <label for="email" class="block text-sm font-medium leading-6 text-gray-900">Email address</label>
                                <div class="mt-2">
                                    <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-md border-0 py-2.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                                </div>
                            </div>

                            <div>
                                <button type="submit" class="flex w-full justify-center rounded-md bg-teal-600 px-3 py-2.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600 transition-transform hover:scale-105">
                                    Send Reset Link
                                </button>
                            </div>
                        </form>
                    </div>
                </template>

                <!-- Success Message -->
                <template x-if="submitted">
                    <div class="text-center">
                         <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-green-100">
                            <i data-lucide="check" class="h-6 w-6 text-green-600"></i>
                        </div>
                        <h2 class="mt-4 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">Check Your Email</h2>
                        <p class="mt-2 text-center text-sm text-gray-600">
                            We've sent a password reset link to the email address you provided.
                        </p>
                    </div>
                </template>

                <p class="mt-10 text-center text-sm text-gray-500">
                    Remember your password?
                    <a href="login.html" class="font-semibold leading-6 text-teal-600 hover:text-teal-500">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
