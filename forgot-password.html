<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenyK - Forgot Password</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="flex min-h-screen">
        <!-- Left Pane with Image -->
        <div class="hidden lg:block relative w-0 flex-1">
            <img class="absolute inset-0 h-full w-full object-cover" src="https://images.unsplash.com/photo-1576941089067-2de3c901e126?q=80&w=2835&auto-format&fit=crop" alt="A modern house exterior">
            <div class="absolute inset-0 bg-teal-800 mix-blend-multiply"></div>
             <div class="absolute inset-0 flex flex-col justify-between p-12">
                <a href="index.html" class="text-3xl font-bold text-white">RenyK</a>
                <div>
                    <h2 class="text-4xl font-bold text-white">Forgot Your Password?</h2>
                    <p class="mt-4 text-lg text-teal-100">No problem. We'll help you get back into your account.</p>
                </div>
                 <div></div>
            </div>
        </div>

        <!-- Right Pane with Form -->
        <div class="flex flex-1 flex-col justify-center px-4 py-12 sm:px-6 lg:flex-none lg:px-20 xl:px-24">
            <div class="mx-auto w-full max-w-sm lg:w-96">
                <div class="text-center lg:hidden mb-8">
                    <a href="index.html" class="text-3xl font-bold text-teal-600">RenyK</a>
                </div>
                
                <div>
                    <h2 class="mt-8 text-2xl font-bold leading-9 tracking-tight text-gray-900">Reset Your Password</h2>
                    <p class="mt-2 text-sm leading-6 text-gray-500">
                        Enter the phone number associated with your account and we'll send you instructions to reset your password.
                    </p>
                </div>

                <div class="mt-8">
                    <form action="#" method="POST" class="space-y-6">
                        <div>
                            <label for="reset-phone" class="block text-sm font-medium leading-6 text-gray-900">Phone Number</label>
                            <div class="mt-2">
                                <input id="reset-phone" name="phone" type="tel" autocomplete="tel" required class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6" placeholder="0712 345 678">
                            </div>
                        </div>
                        
                        <div>
                            <button type="submit" class="flex w-full justify-center rounded-md bg-teal-600 px-3 py-2.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600">Send Reset Instructions</button>
                        </div>
                    </form>

                    <p class="mt-10 text-center text-sm text-gray-500">
                        Remember your password?
                        <a href="login.html" class="font-semibold leading-6 text-teal-600 hover:text-teal-500">Log in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
