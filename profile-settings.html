<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenyK - Profile & Settings</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Alpine.js for interactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        [x-cloak] { display: none !important; }
        .sidebar-link-active {
            background-color: #f0fdfa;
            color: #0d9488;
            border-right: 3px solid #0d9488;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="flex h-screen bg-gray-100">
        <!-- Sidebar -->
        <aside class="w-64 flex-shrink-0 bg-white shadow-md hidden lg:block">
            <div class="flex items-center justify-center h-20 border-b">
                <a href="index.html" class="text-2xl font-bold text-teal-600">RenyK</a>
            </div>
            <nav class="mt-6">
                <a href="dashboard.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="mx-4 font-medium">Dashboard</span>
                </a>
                <a href="payments.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 transition-colors">
                    <i data-lucide="credit-card" class="w-5 h-5"></i>
                    <span class="mx-4 font-medium">Payments</span>
                </a>
                <a href="maintenance.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 transition-colors">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                    <span class="mx-4 font-medium">Maintenance</span>
                </a>
                 <a href="documents.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 transition-colors">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span class="mx-4 font-medium">Documents</span>
                </a>
                <a href="messages.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100 transition-colors">
                    <i data-lucide="message-square" class="w-5 h-5"></i>
                    <span class="mx-4 font-medium">Messages</span>
                </a>
                 <a href="profile-settings.html" class="sidebar-link-active flex items-center px-6 py-3 text-gray-700 font-bold">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span class="mx-4 font-medium">Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="flex justify-between items-center p-6 bg-white border-b">
                <div class="flex items-center">
                    <button class="text-gray-600 focus:outline-none lg:hidden">
                        <i data-lucide="menu" class="h-6 w-6"></i>
                    </button>
                    <h1 class="text-2xl font-semibold text-gray-800 ml-4">Profile & Settings</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- Header icons -->
                    <div x-data="{ dropdownOpen: false }" class="relative">
                        <button @click="dropdownOpen = !dropdownOpen" class="flex items-center space-x-2">
                            <img src="https://placehold.co/40x40/313131/FFFFFF?text=MW" alt="User Avatar" class="h-10 w-10 rounded-full object-cover">
                            <span class="hidden md:block font-medium">Mary W.</span>
                            <i data-lucide="chevron-down" class="h-4 w-4"></i>
                        </button>
                        <div x-show="dropdownOpen" @click.away="dropdownOpen = false" x-cloak class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20">
                            <a href="profile-settings.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="index.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                <div class="container mx-auto">
                    <div x-data="{ tab: 'personal' }" class="bg-white rounded-lg shadow-md">
                        <!-- Tabs -->
                        <div class="border-b">
                            <nav class="flex -mb-px">
                                <button @click="tab = 'personal'" :class="{ 'border-teal-500 text-teal-600': tab === 'personal', 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300': tab !== 'personal' }" class="w-1/3 py-4 px-1 text-center border-b-2 font-medium text-sm focus:outline-none">
                                    Personal Information
                                </button>
                                <button @click="tab = 'security'" :class="{ 'border-teal-500 text-teal-600': tab === 'security', 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300': tab !== 'security' }" class="w-1/3 py-4 px-1 text-center border-b-2 font-medium text-sm focus:outline-none">
                                    Security
                                </button>
                                <button @click="tab = 'notifications'" :class="{ 'border-teal-500 text-teal-600': tab === 'notifications', 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300': tab !== 'notifications' }" class="w-1/3 py-4 px-1 text-center border-b-2 font-medium text-sm focus:outline-none">
                                    Notifications
                                </button>
                            </nav>
                        </div>

                        <!-- Personal Information Content -->
                        <div x-show="tab === 'personal'" class="p-6">
                            <form>
                                <div class="space-y-6">
                                    <div>
                                        <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
                                        <input type="text" id="fullName" value="Mary Wanjiru" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                                    </div>
                                    <div>
                                        <label for="phoneNumber" class="block text-sm font-medium text-gray-700">Phone Number</label>
                                        <input type="tel" id="phoneNumber" value="0712345678" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                                    </div>
                                    <div>
                                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                                        <input type="email" id="email" value="mary.w@example.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                                    </div>
                                </div>
                                <div class="mt-8 flex justify-end">
                                    <button type="submit" class="rounded-md bg-teal-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-teal-500">Save Changes</button>
                                </div>
                            </form>
                        </div>
                        
                        <!-- Security Content -->
                        <div x-show="tab === 'security'" x-cloak class="p-6">
                             <form>
                                <div class="space-y-6">
                                    <div>
                                        <label for="currentPassword" class="block text-sm font-medium text-gray-700">Current Password</label>
                                        <input type="password" id="currentPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                                    </div>
                                    <div>
                                        <label for="newPassword" class="block text-sm font-medium text-gray-700">New Password</label>
                                        <input type="password" id="newPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                                    </div>
                                    <div>
                                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm New Password</label>
                                        <input type="password" id="confirmPassword" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                                    </div>
                                </div>
                                <div class="mt-8 flex justify-end">
                                    <button type="submit" class="rounded-md bg-teal-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-teal-500">Update Password</button>
                                </div>
                            </form>
                        </div>

                        <!-- Notifications Content -->
                        <div x-show="tab === 'notifications'" x-cloak class="p-6">
                            <fieldset>
                                <legend class="text-base font-medium text-gray-900">Notification Preferences</legend>
                                <p class="text-sm text-gray-500">Choose how you'd like to be notified.</p>
                                <div class="mt-4 space-y-4">
                                    <div class="flex items-start">
                                        <div class="flex h-5 items-center">
                                            <input id="email-notifications" name="email-notifications" type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500">
                                        </div>
                                        <div class="ml-3 text-sm">
                                            <label for="email-notifications" class="font-medium text-gray-700">Email Notifications</label>
                                            <p class="text-gray-500">Get important updates via email.</p>
                                        </div>
                                    </div>
                                    <div class="flex items-start">
                                        <div class="flex h-5 items-center">
                                            <input id="sms-notifications" name="sms-notifications" type="checkbox" checked class="h-4 w-4 rounded border-gray-300 text-teal-600 focus:ring-teal-500">
                                        </div>
                                        <div class="ml-3 text-sm">
                                            <label for="sms-notifications" class="font-medium text-gray-700">SMS Notifications</label>
                                            <p class="text-gray-500">Get rent reminders and urgent alerts via SMS.</p>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                             <div class="mt-8 flex justify-end">
                                <button type="submit" class="rounded-md bg-teal-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-teal-500">Save Preferences</button>
                            </div>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>

</body>
</html>
