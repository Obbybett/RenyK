<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenyK - Login & Sign Up</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Alpine.js for interactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50">

    <div class="flex min-h-screen flex-col items-center justify-center bg-cover bg-center px-6 py-12 lg:px-8" style="background-image: url('https://images.unsplash.com/photo-1560518883-ce09059ee41F?q=80&w=2874&auto=format&fit=crop');">
        
        <div x-data="{ tab: 'login' }" class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-2xl p-8 sm:p-12">
                <a href="index.html" class="text-2xl font-bold text-teal-600 block text-center mb-6">RenyK</a>

                <!-- Tabs -->
                <div class="mb-8">
                    <div class="border-b border-gray-200">
                        <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                            <button @click="tab = 'login'" :class="{ 'border-teal-500 text-teal-600': tab === 'login', 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700': tab !== 'login' }" class="whitespace-nowrap border-b-2 py-4 px-1 text-sm font-medium">
                                Log In
                            </button>
                            <button @click="tab = 'signup'" :class="{ 'border-teal-500 text-teal-600': tab === 'signup', 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700': tab !== 'signup' }" class="whitespace-nowrap border-b-2 py-4 px-1 text-sm font-medium">
                                Create Account
                            </button>
                        </nav>
                    </div>
                </div>

                <!-- Login Form -->
                <div x-show="tab === 'login'" x-cloak>
                    <h2 class="text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">Welcome Back</h2>
                    <form class="mt-8 space-y-6" action="#" method="POST">
                        <div>
                            <label for="phone-login" class="block text-sm font-medium leading-6 text-gray-900">Phone Number</label>
                            <div class="mt-2">
                                <input id="phone-login" name="phone" type="tel" autocomplete="tel" required placeholder="e.g., 0712345678" class="block w-full rounded-md border-0 py-2.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center justify-between">
                                <label for="password-login" class="block text-sm font-medium leading-6 text-gray-900">Password</label>
                                <div class="text-sm">
                                    <a href="forgot-password.html" class="font-semibold text-teal-600 hover:text-teal-500">Forgot password?</a>
                                </div>
                            </div>
                            <div class="mt-2">
                                <input id="password-login" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-md border-0 py-2.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="flex w-full justify-center rounded-md bg-teal-600 px-3 py-2.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600 transition-transform hover:scale-105">Log In</button>
                        </div>
                    </form>
                </div>

                <!-- Sign Up Form -->
                <div x-show="tab === 'signup'" x-cloak>
                     <h2 class="text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">Join RenyK Today</h2>
                    <form class="mt-8 space-y-4" action="#" method="POST">
                         <div>
                            <label for="full-name" class="block text-sm font-medium leading-6 text-gray-900">Full Name</label>
                            <div class="mt-2">
                                <input id="full-name" name="full-name" type="text" autocomplete="name" required class="block w-full rounded-md border-0 py-2.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                            </div>
                        </div>
                        <div>
                            <label for="phone-signup" class="block text-sm font-medium leading-6 text-gray-900">Phone Number</label>
                            <div class="mt-2">
                                <input id="phone-signup" name="phone" type="tel" autocomplete="tel" required placeholder="e.g., 0712345678" class="block w-full rounded-md border-0 py-2.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                            </div>
                        </div>
                         <div>
                            <label for="email-signup" class="block text-sm font-medium leading-6 text-gray-900">Email address</label>
                             <p class="text-xs text-gray-500">Used for account recovery and notifications.</p>
                            <div class="mt-1">
                                <input id="email-signup" name="email" type="email" autocomplete="email" required class="block w-full rounded-md border-0 py-2.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                            </div>
                        </div>
                        <div>
                            <label for="password-signup" class="block text-sm font-medium leading-6 text-gray-900">Password</label>
                            <div class="mt-2">
                                <input id="password-signup" name="password" type="password" autocomplete="new-password" required class="block w-full rounded-md border-0 py-2.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-teal-600 sm:text-sm sm:leading-6">
                            </div>
                        </div>
                        <div>
                            <button type="submit" class="flex w-full justify-center rounded-md bg-teal-600 px-3 py-2.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-teal-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600 transition-transform hover:scale-105">Create Account</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
